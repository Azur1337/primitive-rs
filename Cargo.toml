[package]
name = "primitive-rs"
version = "0.1.0"
edition = "2021"
description = "Reproduce images with geometric primitives."
license = "MIT"

[lib]
name = "primitive"
path = "src/lib.rs"

[[bin]]
name = "primitive"
path = "src/main.rs"

[dependencies]
image = "0.25"
rand = "0.8"
rand_distr = "0.4"
clap = { version = "4", features = ["derive"] }
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
